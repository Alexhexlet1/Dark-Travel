<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkest Corridor RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        
        <!-- ХЕДЕР: Панель персонажа (stats, level, gold) -->
        <header class="hud-panel">
            <div class="player-profile">
                <span class="player-name">Рыцарь Смерти</span>
                <span class="player-level">Ур. <span id="lvl-val">1</span></span>
            </div>
            
            <div class="bars-container">
                <div class="stat-group">
                    <span class="stat-label">HP</span>
                    <div class="bar-container hp-bg">
                        <div id="hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="stat-group">
                    <span class="stat-label">MP</span>
                    <div class="bar-container mp-bg">
                        <div id="mp-bar" class="bar-fill mp-fill" style="width: 80%;"></div>
                    </div>
                </div>
            </div>

            <div class="player-currency">
                <span class="gold-icon">🪙</span>
                <span id="gold-val">150</span>
            </div>
        </header>

        <!-- ЛЕВАЯ КОЛОНКА: Инвентарь и Экипировка -->
        <aside class="inventory-panel">
            <h3 class="panel-title">Экипировка</h3>
            <div class="equipment-slots">
                <div class="slot" id="slot-weapon" data-tooltip="Оружие">⚔️ Ржавый меч</div>
                <div class="slot" id="slot-armor" data-tooltip="Броня">🛡️ Обноски</div>
            </div>

            <h3 class="panel-title">Сумка</h3>
            <div class="bag-slots">
                <button class="item-btn" id="potion-hp" data-item="potion-hp">🧪 Зелье ОЗ (2)</button>
                <button class="item-btn" id="potion-mp" data-item="potion-mp">🧪 Зелье ОМ (1)</button>
                <div class="slot empty">Пусто</div>
                <div class="slot empty">Пусто</div>
            </div>
        </aside>

        <!-- ЦЕНТР: Экран локации и Активные эффекты -->
        <main class="screen-panel">
            <div id="active-effects" class="effects-list">
                <span class="effect-badge buff">🔥 Ярость</span>
            </div>
            <img id="location-img" src="room1.jpg" alt="Локация подземелья">
        </main>

        <!-- ПРАВАЯ НИЖНЯЯ ПАНЕЛЬ: Окно истории (Квесты и описания) -->
        <section class="story-panel">
            <div id="story-text">Вы стоите перед тяжелой дубовой дверью. Из щелей тянет сыростью и едва уловимым запахом серы. Слышен далекий скрежет. Что предпримете?</div>
        </section>

        <!-- ЛЕВАЯ НИЖНЯЯ ПАНЕЛЬ: Лог боя и событий -->
        <section class="log-panel">
            <h4 class="log-title">Журнал событий:</h4>
            <div id="log-container" class="log-content">
                <p class="log-row system">Вы вошли в заброшенный склеп...</p>
            </div>
        </section>

        <!-- КНОПКИ ДЕЙСТВИЙ (Перезаписываются из скрипта при старте) -->
        <nav id="action-buttons" class="actions-panel">
            <button class="btn" data-action="next">Выбить дверь плечом</button>
            <button class="btn" data-action="magic">Использовать заклинание</button>
            <button class="btn" data-action="search">Обыскать углы</button>
        </nav>

    </div>

    <!-- ТОЧНОЕ ПОДКЛЮЧЕНИЕ СКРИПТА ИЗ ПАПКИ SRC -->
    <script src="src/script.js"></script>

</body>
</html>
